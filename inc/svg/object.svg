<svg id="motion" xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" viewBox="0 0 382 447" style="enable-background:new 0 0 382 447;" xml:space="preserve">
<style type="text/css">
	.st0{fill:none;stroke:#50E3C2;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;}
	.st1{fill:none;stroke:#9000FF;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;}
	.st2{fill:#6CB7FF;}
	.st3{fill:#FFD200;}
	.st4{fill:none;stroke:#FFFFFF;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;}
	.st5{fill:none;stroke:#135AFE;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;}
	.st6{fill:none;stroke:#FFD200;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;}
	.st7{fill:#50E3C2;}

	/* 공통 애니메이션 설정 */
	.anim-element {
		will-change: transform;
		animation-duration: 10s;
		animation-timing-function: cubic-bezier(0, 0, 0.2, 1);
		animation-iteration-count: infinite;
		animation-fill-mode: forwards;
		animation-delay: 0.7s;
	}

	/* 1. Mint Ripple 애니메이션 */
	@keyframes mintRippleAnim {
		0%, 12.5% { transform: translate(282px, 132px) rotate(0deg); }
		25%, 37.5% { transform: translate(313px, 400px) rotate(-158deg); }
		50%, 62.5% { transform: translate(110px, 220px) rotate(-251deg); }
		75%, 87.5% { transform: translate(80px, 80px) rotate(-123deg); }
		100% { transform: translate(282px, 132px) rotate(0deg); }
	}
	#mint_ripple_g { animation-name: mintRippleAnim; }

	/* 2. Purple Bar 애니메이션 */
	@keyframes purpleBarAnim {
		0%, 12.5% { transform: translate(79px, 35px) rotate(0deg); }
		25%, 37.5% { transform: translate(286px, 35px) rotate(-80deg); }
		50%, 62.5% { transform: translate(244px, 360px) rotate(-248deg); }
		75%, 87.5% { transform: translate(49px, 168px) rotate(-123deg); }
		100% { transform: translate(79px, 35px) rotate(0deg); }
	}
	#purple_bar_g { animation-name: purpleBarAnim; }

	/* 3. Sky Triangle 애니메이션 */
	@keyframes skyTriAnim {
		0%, 12.5% { transform: translate(302px, 14px) rotate(0deg); }
		25%, 37.5% { transform: translate(100px, 312px) rotate(104deg); }
		50%, 62.5% { transform: translate(320px, 123px) rotate(174deg); }
		75%, 87.5% { transform: translate(55px, 230px) rotate(-291deg); }
		100% { transform: translate(302px, 14px) rotate(0deg); }
	}
	#sky_tri_g { animation-name: skyTriAnim; }

	/* 4. Yellow Circle 애니메이션 */
	@keyframes yellowCircleAnim {
		0%, 12.5% { transform: translate(260px, 2px); }
		25%, 37.5% { transform: translate(330px, 180px); }
		50%, 62.5% { transform: translate(100px, 50px); }
		75%, 87.5% { transform: translate(309px, 250px); }
		100% { transform: translate(260px, 2px); }
	}
	#yellow_circle_g { animation-name: yellowCircleAnim; }

	/* 5. White Curve (b) 애니메이션 */
	@keyframes bWhiteCurveAnim {
		0%, 12.5% { transform: translate(292px, 299px) rotate(0deg); }
		25%, 37.5% { transform: translate(66px, 66px) rotate(170deg); }
		50%, 62.5% { transform: translate(82px, 302px) rotate(85deg); }
		75%, 87.5% { transform: translate(272px, 21px) rotate(-298deg); }
		100% { transform: translate(292px, 299px) rotate(0deg); }
	}
	#b_white_curve_g { animation-name: bWhiteCurveAnim; }

	/* 6. White Curve 애니메이션 */
	@keyframes whiteCurveAnim {
		0%, 12.5% { transform: translate(23px, 389px) rotate(0deg); }
		25%, 37.5% { transform: translate(27px, 247px) rotate(-91deg); }
		50%, 62.5% { transform: translate(310px, 263px) rotate(42deg); }
		75%, 87.5% { transform: translate(88px, 345px) rotate(-138deg); }
		100% { transform: translate(23px, 389px) rotate(0deg); }
	}
	#white_curve_g { animation-name: whiteCurveAnim; }

	/* 7. Blue Bar 애니메이션 */
	@keyframes blueBarAnim {
		0%, 12.5% { transform: translate(30px, 276px) rotate(0deg); }
		25%, 37.5% { transform: translate(280px, 244px) rotate(190deg); }
		50%, 62.5% { transform: translate(81px, 117px) rotate(91deg); }
		75%, 87.5% { transform: translate(300px, 380px) rotate(170deg); }
		100% { transform: translate(30px, 276px) rotate(0deg); }
	}
	#blue_bar_g { animation-name: blueBarAnim; }

	/* 8. Yellow Bar 애니메이션 */
	@keyframes yellowBarAnim {
		0%, 12.5% { transform: translate(315px, 335px) rotate(0deg); }
		25%, 37.5% { transform: translate(72px, 135px) rotate(-120deg); }
		50%, 62.5% { transform: translate(266px, 39px) rotate(-212deg); }
		75%, 87.5% { transform: translate(266px, 196px) rotate(-96deg); }
		100% { transform: translate(315px, 335px) rotate(0deg); }
	}
	#yellow_bar_g { animation-name: yellowBarAnim; }

	/* 9. Mint Square 애니메이션 */
	@keyframes mintTriAnim {
		0%, 12.5% { transform: translate(54px, 232px) rotate(0deg); }
		25%, 37.5% { transform: translate(293px, 97px) rotate(182deg); }
		50%, 62.5% { transform: translate(297px, 168px) rotate(106deg); }
		75%, 87.5% { transform: translate(35px, 400px) rotate(-27deg); }
		100% { transform: translate(54px, 232px) rotate(0deg); }
	}
	#mint_tri_g { animation-name: mintTriAnim; }
</style>

<g id="mint_ripple_g" class="anim-element">
	<path id="mint_ripple" class="st0" d="M9.8,3.2l0.9,10.3l9.5-4.3l0.9,10.4l9.4-4.4l1.1,10.4l9.4-4.4"></path>
</g>

<g id="purple_bar_g" class="anim-element">
	<path id="purple_bar" class="st1" d="M0,19L16,0"></path>
</g>

<g id="sky_tri_g" class="anim-element">
	<path id="sky_tri" class="st2" d="M10.4,2.7L2.9,12.9l12.2,1.4L10.4,2.7z"></path>
</g>

<g id="yellow_circle_g" class="anim-element">
	<path class="st3" d="M1,41.5c-6.6,0-12-5.4-12-12s5.4-12,12-12s12,5.4,12,12S7.6,41.5,1,41.5z M1,21.5c-4.4,0-8,3.6-8,8s3.6,8,8,8 s8-3.6,8-8S5.4,21.5,1,21.5z" />
</g>

<g id="b_white_curve_g" class="anim-element">
	<path id="b_white_curve" class="st4" d="M0.6,30.5C9.4,37,22,37.2,31,30c9-7.4,11.5-20,6.7-30"></path>
</g>

<g id="white_curve_g" class="anim-element">
	<path id="white_curve" class="st4" d="M25,6.7C19.7,4,13,5,9,9.5C4.5,14,4,21,7.2,25.8"></path>
</g>

<g id="blue_bar_g" class="anim-element">
	<path id="blue_bar_1_" class="st5" d="M29,27.7L0,0"></path>
</g>

<g id="yellow_bar_g" class="anim-element">
	<path id="yellow_bar" class="st6" d="M7.8,10.2L0.4,0"></path>
</g>

<g id="mint_tri_g" class="anim-element">
	<path id="mint_square" class="st7" d="M27.6,23.2l-9.7-10.3l10.3-9.7l9.7,10.3L27.6,23.2z"></path>
</g>
</svg>